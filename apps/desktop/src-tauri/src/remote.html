<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0708">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Пульт">
<title>KINONYX — пульт</title>
<style>
  /* Colours: the app's own (the theme chosen in Settings) are put in front of these by the server and refreshed by the page. */
  :root {
    --bg: #0a0708; --bg-2: #120c0e;
    --surface: rgba(255,255,255,.055); --surface-hi: rgba(255,255,255,.11);
    --line: rgba(255,255,255,.09); --line-hi: rgba(255,255,255,.18);
    --text: #f3ece7; --text-dim: rgba(243,236,231,.58);
    --accent: #e63950; --accent-deep: #a11f31; --on-accent: #fff;
    --radius: 8px; --logo-filter: none;
    --font: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; }
  html, body { margin: 0; height: 100%; overscroll-behavior: none; }
  body {
    background: radial-gradient(120% 70% at 50% 0%, var(--bg-2), var(--bg) 70%) var(--bg);
    color: var(--text); font: 17px/1.25 var(--font); touch-action: manipulation;
    display: flex; flex-direction: column; gap: 14px; overflow: hidden;
    padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
  }
  svg { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  svg .fill { fill: currentColor; stroke: none; }

  /* No answer from the app (the PC is off, KINONYX is closed, another network): said in words, not only by the dot. */
  .offline { display: none; align-items: center; justify-content: center; text-align: center; min-height: 40px; padding: 8px 16px; border-radius: 20px; background: rgba(255,59,74,.16); color: #ffb3ba; font-size: 14px; font-weight: 600; }
  .offline.on { display: flex; animation: rise .3s cubic-bezier(.2,.8,.2,1) both; }
  header { position: relative; display: flex; align-items: center; justify-content: center; min-height: 40px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .22em; font-size: 16px; }
  .brand img { width: 28px; height: 28px; object-fit: contain; filter: var(--logo-filter); }
  /* Connection: only a dot — green while the app answers, red when it does not. */
  .dot { position: absolute; right: 2px; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 0 3px rgba(61,220,132,.18); transition: background .2s, box-shadow .2s; }
  .dot.off { background: #ff3b4a; box-shadow: 0 0 0 3px rgba(255,59,74,.2); }

  main { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; }

  /* Press feedback shared by every key: a solid surface that fills with the accent while held. */
  .key {
    position: relative; display: grid; place-items: center; border: 1px solid var(--line); background: var(--surface);
    color: var(--text); border-radius: var(--radius); font: inherit; padding: 0; cursor: pointer;
    transition: transform .08s, background .12s, border-color .12s;
  }
  .key.down { transform: scale(.955); background: var(--surface-hi); border-color: var(--line-hi); }
  .key { overflow: hidden; }
  .rip { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--text); opacity: .28; pointer-events: none; animation: rip .55s ease-out forwards; }
  @keyframes rip { to { transform: scale(15); opacity: 0; } }
  .media .main .rip { background: var(--on-accent); }

  .media { display: grid; grid-template-columns: 1fr 1.35fr 1fr; gap: 10px; }
  .media .key { height: 64px; font-size: 28px; }
  .media .main { background: var(--accent); color: var(--on-accent); border-color: transparent; font-size: 32px; }
  .media .main.down { background: var(--accent-deep); }

  .pad-wrap { flex: 1; min-height: 0; display: grid; place-items: center; }
  /* The volume: "−", the level, "+" in one capsule, above the navigation keys. */
  .vol {
    display: flex; align-items: center; gap: 10px; height: 62px; margin-top: 10px; padding: 0 8px;
    border-radius: 31px; background: var(--surface); border: 1px solid var(--line);
  }
  .vol .key { flex: none; width: 46px; height: 46px; border-radius: 50%; }
  .vol .key svg { width: 24px; height: 24px; }
  .vol-track {
    flex: 1; min-width: 0; height: 44px; margin: 0; padding: 0; appearance: none; -webkit-appearance: none;
    background: transparent; touch-action: none; cursor: pointer;
  }
  .vol-track::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, var(--accent) var(--v, 0%), var(--line-hi) var(--v, 0%)); }
  .vol-track::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, var(--accent) var(--v, 0%), var(--line-hi) var(--v, 0%)); }
  .vol-track::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 18px; height: 18px; margin-top: -6px; border-radius: 50%; background: var(--text); }
  .vol-track::-moz-range-thumb { width: 18px; height: 18px; border: 0; border-radius: 50%; background: var(--text); }
  .vol :disabled { opacity: .45; cursor: default; }
  .pad {
    position: relative; width: min(100%, 52vh, 360px); aspect-ratio: 1;
    border-radius: 50%; background: var(--surface); border: 1px solid var(--line); overflow: hidden;
  }
  .pad .arrow {
    position: absolute; display: grid; place-items: center; border: 0; background: none; color: var(--text-dim); font-size: 36px; padding: 0;
    transition: color .15s;
  }
  .pad .arrow svg { position: relative; z-index: 1; transition: transform .16s cubic-bezier(.2,.8,.2,1); }
  /* The pressed arrow lights a round halo around its icon; the icon leans the way it points. */
  .pad .arrow::before {
    content: ""; position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%;
    background: var(--accent); opacity: 0; transform: scale(.35); pointer-events: none;
    transition: opacity .22s ease-out, transform .26s cubic-bezier(.2,.8,.2,1);
  }
  .pad .arrow.down { color: var(--on-accent); }
  .pad .arrow.down::before { opacity: .95; transform: scale(1); transition-duration: .08s; }
  .pad .arrow.u.down svg { transform: translateY(-4px) scale(1.12); }
  .pad .arrow.d.down svg { transform: translateY(4px) scale(1.12); }
  .pad .arrow.l.down svg { transform: translateX(-4px) scale(1.12); }
  .pad .arrow.r.down svg { transform: translateX(4px) scale(1.12); }
  .pad .u { top: 0; left: 24%; width: 52%; height: 31%; }
  .pad .d { bottom: 0; left: 24%; width: 52%; height: 31%; }
  .pad .l { left: 0; top: 24%; width: 31%; height: 52%; }
  .pad .r { right: 0; top: 24%; width: 31%; height: 52%; }
  .pad::before, .pad::after { content: ""; position: absolute; background: var(--line); pointer-events: none; }
  .pad::before { left: 14%; right: 14%; top: 50%; height: 1px; transform: rotate(45deg); }
  .pad::after { left: 14%; right: 14%; top: 50%; height: 1px; transform: rotate(-45deg); }
  .pad .ok {
    position: absolute; left: 32%; top: 32%; width: 36%; height: 36%; border-radius: 50%; border: 0;
    background: var(--accent); color: var(--on-accent); font: 700 22px var(--font); letter-spacing: .04em; z-index: 1;
    transition: transform .08s, background .12s;
  }
  .pad .ok.down { transform: scale(.94); background: var(--accent-deep); }
  .pad .ok::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--accent); opacity: 0; pointer-events: none; }
  .pad .ok.down::after { animation: ring .55s ease-out; }
  @keyframes ring { from { opacity: .8; transform: scale(1); } to { opacity: 0; transform: scale(1.7); } }

  .bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .bar .key { height: 62px; font-size: 24px; }

  /* Focusing a real input inside the tap opens the phone's native keyboard. */
  #typing { position: fixed; }
  .keyboard-input {
    position: fixed; bottom: 0; left: 0; width: 1px; height: 1px; padding: 0;
    border: 0; opacity: 0; pointer-events: none; font-size: 16px; user-select: text; -webkit-user-select: text;
  }

  /* Coming in: each part rises into place a beat after the one above it. */
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } }
  @keyframes pop { from { opacity: 0; transform: scale(.9); } }
  header { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
  .media { animation: rise .5s .06s cubic-bezier(.2,.8,.2,1) both; }
  .pad { animation: pop .6s .12s cubic-bezier(.2,.8,.2,1) both; }
  .vol { animation: rise .5s .16s cubic-bezier(.2,.8,.2,1) both; }
  .bar { animation: rise .5s .2s cubic-bezier(.2,.8,.2,1) both; }
  .dot.ping { animation: ping .5s ease-out; }
  @keyframes ping { 50% { transform: scale(1.7); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* Wide screen (phone on its side): the pad on the left, everything else on the right. */
  @media (orientation: landscape) and (max-height: 560px) {
    body { flex-direction: row; flex-wrap: wrap; align-content: flex-start; gap: 10px 22px; }
    header { width: 100%; min-height: 24px; }
    main { flex: 1; flex-direction: row; align-items: stretch; gap: 22px; }
    .pad-wrap { flex: 1; }
    .pad { width: min(100%, 62vh); }
    .side { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px; min-width: 0; }
    .media .key, .bar .key { height: 56px; }
  }
  .side { display: contents; }
  @media (orientation: landscape) and (max-height: 560px) { .side { display: flex; } }

  /* ---- The look of the app's pages: soft rounded keys, light fill when pressed, a white OK. ---- */
  .key { border: 0; background: rgba(255,255,255,.14); border-radius: 22px; transition: transform .1s, background .14s, color .14s; }
  .key.down { transform: scale(.95); background: rgba(244,244,247,.95); color: #1d1d20; }
  .rip { background: #fff; opacity: .35; }
  .key.down .rip { background: #1d1d20; opacity: .12; }
  .media .main { background: rgba(244,244,247,.95); color: #111; border: 0; }
  .media .main.down { background: #d3d3da; }
  .media .main .rip { background: #000; opacity: .12; }

  .pad { border: 0; background: rgba(255,255,255,.12); }
  .pad::before, .pad::after { background: rgba(255,255,255,.07); }
  .pad .arrow { color: rgba(255,255,255,.78); }
  .pad .arrow::before { background: rgba(244,244,247,.95); }
  .pad .arrow.down { color: #111; }
  .pad .ok { background: rgba(244,244,247,.95); color: #111; }
  .pad .ok.down { background: #cfcfd6; }
  .pad .ok::after { border-color: #fff; }

  #kb[aria-pressed="true"] { background: rgba(244,244,247,.95); color: #111; }
</style>
<style id="app-theme">/*THEME*/</style>
</head>
<body>
  <header>
    <span class="brand"><img id="logo" alt="">KINONYX</span>
    <i class="dot" id="dot" aria-label="связь"></i>
  </header>

  <div class="offline" id="offline">Нет связи с KINONYX. Запустите программу на компьютере и проверьте, что телефон в той же сети Wi-Fi.</div>

  <main>
    <div class="side" id="side">
      <div class="media">
        <button class="key" data-k="MediaRewind" data-rep="1" aria-label="Назад на 15 секунд">
          <svg viewBox="0 0 24 24"><polygon points="11 19 2 12 11 5 11 19"/><polygon points="22 19 13 12 22 5 22 19"/></svg>
        </button>
        <button class="key main" data-k="p" aria-label="Пауза / продолжить">
          <svg viewBox="0 0 24 24"><polygon class="fill" points="6 4 20 12 6 20 6 4"/></svg>
        </button>
        <button class="key" data-k="MediaFastForward" data-rep="1" aria-label="Вперёд на 15 секунд">
          <svg viewBox="0 0 24 24"><polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/></svg>
        </button>
      </div>
      <div class="vol" id="vol" aria-label="Громкость">
        <button class="key" data-volume-step="-1" data-rep="1" aria-label="Тише на 1%" disabled><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <input class="vol-track" id="volume" type="range" min="0" max="100" step="1" value="0" aria-label="Громкость в процентах" disabled>
        <button class="key" data-volume-step="1" data-rep="1" aria-label="Громче на 1%" disabled><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
    </div>

    <div class="pad-wrap">
      <div class="pad">
        <button class="arrow u" data-k="ArrowUp" aria-label="Вверх"><svg viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg></button>
        <button class="arrow l" data-k="ArrowLeft" aria-label="Влево"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
        <button class="arrow r" data-k="ArrowRight" aria-label="Вправо"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
        <button class="arrow d" data-k="ArrowDown" aria-label="Вниз"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
        <button class="ok" data-k="Enter" aria-label="OK">OK</button>
      </div>
    </div>

    <div class="side" id="side2">
      <form id="typing" autocomplete="off">
        <input class="keyboard-input" id="editor" type="text" tabindex="-1" enterkeyhint="done" maxlength="2000" aria-label="Ввод в выбранное поле KINONYX" autocapitalize="off" autocorrect="off" spellcheck="false">
      </form>
      <div class="bar">
        <button class="key" data-k="Escape" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
        <button class="key" data-k="GamepadGuide" aria-label="Меню"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <button class="key" data-k="m" aria-label="Звук и субтитры"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15h4M15 15h2M7 11h2M13 11h4"/></svg></button>
        <button class="key" id="kb" type="button" aria-label="Клавиатура" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h.01M12 12h.01M16 12h.01M7 16h10"/></svg></button>
      </div>
    </div>
  </main>

<script>
  const t = new URLSearchParams(location.search).get("t") || "";
  const dot = document.getElementById("dot");
  const offlineNote = document.getElementById("offline");
  let failures = 0;
  // The note shows only after a few answers in a row are missing — one lost packet is not "no connection".
  const mark = ok => {
    dot.classList.toggle("off", !ok);
    failures = ok ? 0 : failures + 1;
    offlineNote.classList.toggle("on", failures >= 2);
  };
  // The page can be kept on the home screen: the icon opens it at this same address.
  (() => {
    const add = (rel, href) => { const l = document.createElement("link"); l.rel = rel; l.href = href; document.head.appendChild(l); };
    add("manifest", "/manifest.json?t=" + encodeURIComponent(t));
    add("apple-touch-icon", "/logo.png?t=" + encodeURIComponent(t));
  })();
  document.getElementById("logo").src = "/logo.png?t=" + encodeURIComponent(t);
  const send = (path, extra = "", init) => fetch(path + "?t=" + encodeURIComponent(t) + extra, { cache: "no-store", ...init })
    .then(r => { mark(r.ok); return r.ok; }).catch(() => { mark(false); return false; });
  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
  const blink = () => { dot.classList.remove("ping"); void dot.offsetWidth; dot.classList.add("ping"); };
  const press = k => { buzz(10); blink(); return send("/k", "&k=" + encodeURIComponent(k)); };
  const ripple = (b, e) => {
    if (b.classList.contains("arrow") || b.classList.contains("ok")) return; // those have their own effect
    const r = b.getBoundingClientRect(), pt = (e.touches && e.touches[0]) || e;
    const span = document.createElement("span");
    span.className = "rip";
    span.style.left = (pt.clientX - r.left) + "px";
    span.style.top = (pt.clientY - r.top) + "px";
    b.appendChild(span);
    setTimeout(() => span.remove(), 600);
  };

  const volume = document.getElementById("volume");
  const volumeKeys = document.querySelectorAll("[data-volume-step]");
  let nextVolume = null;
  let volumeSending = false;
  let volumeTimer = 0;
  let volumeRevision = 0;
  let volumeQuietUntil = 0;
  let volumeDragging = false;
  const showVolume = level => {
    volume.value = level;
    volume.style.setProperty("--v", level + "%");
  };
  const flushVolume = async () => {
    volumeTimer = 0;
    if (volumeSending || nextVolume === null) return;
    const { level, feedback } = nextVolume;
    nextVolume = null;
    volumeSending = true;
    await send("/volume", "&v=" + level + (feedback ? "&step=1" : ""));
    volumeSending = false;
    volumeQuietUntil = performance.now() + 500;
    if (nextVolume !== null && !volumeTimer) volumeTimer = setTimeout(flushVolume, 50);
  };
  const setVolume = (level, feedback = false) => {
    if (volume.disabled) return;
    const clamped = Math.min(100, Math.max(0, level));
    showVolume(clamped);
    volumeRevision++;
    nextVolume = { level: clamped, feedback: feedback || !!nextVolume?.feedback };
    if (!volumeSending && !volumeTimer) volumeTimer = setTimeout(flushVolume, 50);
  };
  volume.addEventListener("input", () => setVolume(volume.valueAsNumber));
  volume.addEventListener("pointerdown", () => { volumeDragging = true; });
  window.addEventListener("pointerup", () => { volumeDragging = false; });
  window.addEventListener("pointercancel", () => { volumeDragging = false; });
  volume.addEventListener("change", () => {
    clearTimeout(volumeTimer);
    void flushVolume();
  });

  const editor = document.getElementById("editor");
  const keyboard = document.getElementById("kb");
  let editQueue = Promise.resolve();
  const queueEdit = edit => {
    editQueue = editQueue.then(() => send("/edit", "", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(edit)
    }));
  };
  // A zero-width character lets even an empty phone editor send Backspace to the selected field.
  const marker = "\u200b";
  const resetEditor = () => {
    editor.value = marker;
    editor.setSelectionRange(1, 1);
  };
  let previous = [];
  const relay = () => {
    const raw = editor.value;
    const next = Array.from(raw.startsWith(marker) ? raw.slice(1) : raw);
    let same = 0;
    while (same < previous.length && same < next.length && previous[same] === next[same]) same++;
    const remove = previous.length - same || Number(!raw);
    const text = next.slice(same).join("");
    previous = next;
    if (!raw) resetEditor();
    if (remove || text) queueEdit({ remove, text });
  };
  keyboard.addEventListener("click", () => {
    void press("RemoteKeyboard");
    if (keyboard.getAttribute("aria-pressed") === "true") {
      editor.blur();
    } else {
      previous = [];
      resetEditor();
      editor.focus({ preventScroll: true });
    }
  });
  keyboard.addEventListener("pointerdown", e => {
    if (document.activeElement === editor) e.preventDefault();
  });
  editor.addEventListener("focus", () => keyboard.setAttribute("aria-pressed", "true"));
  editor.addEventListener("blur", () => keyboard.setAttribute("aria-pressed", "false"));
  editor.addEventListener("input", e => { if (!e.isComposing) relay(); });
  editor.addEventListener("compositionend", relay);
  const finishTyping = () => {
    relay();
    queueEdit({ remove: 0, text: "", submit: true });
    editor.blur();
  };
  editor.addEventListener("keydown", e => {
    if (e.key !== "Enter" || e.isComposing) return;
    e.preventDefault();
    finishTyping();
  });
  document.getElementById("typing").addEventListener("submit", e => {
    e.preventDefault();
    finishTyping();
  });

  // Pointer input reacts once per tap, then repeats for the controls that support holding.
  document.querySelectorAll("[data-k], [data-volume-step]").forEach(b => {
    let delay = 0, rep = 0;
    const activate = () => {
      if (b.dataset.volumeStep) {
        buzz(10);
        blink();
        setVolume(volume.valueAsNumber + Number(b.dataset.volumeStep), true);
      } else {
        editor.blur();
        void press(b.dataset.k);
      }
    };
    const start = e => {
      if (!e.isPrimary || e.button !== 0) return;
      e.preventDefault();
      b.setPointerCapture(e.pointerId);
      b.classList.add("down");
      ripple(b, e);
      activate();
      if (b.dataset.k?.startsWith("Arrow") || b.dataset.rep) {
        delay = setTimeout(() => { rep = setInterval(activate, 120); }, 380);
      }
    };
    const stop = () => { b.classList.remove("down"); clearTimeout(delay); clearInterval(rep); };
    b.addEventListener("pointerdown", start);
    b.addEventListener("lostpointercapture", stop);
    b.addEventListener("click", e => { if (e.detail === 0) activate(); });
  });

  // The app's theme: read again every few seconds (it doubles as the connection check), so changing the
  // theme in the app changes the remote too.
  let lastTheme = "";
  const loadTheme = () => {
    const revision = volumeRevision;
    return fetch("/theme?t=" + encodeURIComponent(t), { cache: "no-store" })
      .then(r => r.ok ? r.text() : Promise.reject()).then(text => {
        mark(true);
        const vars = JSON.parse(text);
        if (revision === volumeRevision && !volumeDragging && !volumeSending && nextVolume === null && performance.now() >= volumeQuietUntil) {
          const level = Number.parseFloat(vars["--player-volume"]);
          volume.disabled = !Number.isFinite(level);
          volumeKeys.forEach(key => { key.disabled = volume.disabled; });
          showVolume(volume.disabled ? 0 : Math.round(Math.max(0, Math.min(1, level)) * 100));
        }
        if (text === lastTheme) return;
        lastTheme = text;
        const root = document.documentElement.style;
        for (const k in vars) if (/^--[a-z0-9-]+$/.test(k)) root.setProperty(k, vars[k]);
        const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
        if (bg) document.querySelector('meta[name="theme-color"]').content = bg;
      }).catch(() => mark(false));
  };
  loadTheme();

  // The phone stays awake while the remote is open.
  const keepAwake = async () => { try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch (e) {} };
  keepAwake();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { keepAwake(); loadTheme(); } });
  setInterval(loadTheme, 1500);
  document.addEventListener("contextmenu", e => e.preventDefault());
</script>
</body>
