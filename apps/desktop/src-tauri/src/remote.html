<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0e0e11">
<title>KINONYX — пульт</title>
<style>
  :root { --bg:#0e0e11; --panel:#1a1a20; --line:#2b2b34; --text:#f2f2f5; --dim:#9a9aa8; --accent:#ff4b55; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 17px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action: manipulation; }
  body { display: flex; flex-direction: column; padding: max(14px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom)); gap: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; color: var(--dim); font-size: 15px; }
  header b { color: var(--text); font-size: 18px; letter-spacing: .02em; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #3ddc84; display: inline-block; margin-right: 8px; transition: background .2s; }
  .dot.off { background: var(--accent); }
  .dpad { position: relative; width: min(78vw, 330px); aspect-ratio: 1; margin: 6px auto 0; border-radius: 50%; background: var(--panel); border: 1px solid var(--line); }
  .dpad button { position: absolute; display: grid; place-items: center; background: none; border: 0; color: var(--text); font-size: 30px; }
  .dpad button:active, .dpad button.hit { background: rgba(255,255,255,.1); }
  .up    { top: 0; left: 28%; width: 44%; height: 28%; border-radius: 80px 80px 14px 14px; }
  .down  { bottom: 0; left: 28%; width: 44%; height: 28%; border-radius: 14px 14px 80px 80px; }
  .left  { left: 0; top: 28%; width: 28%; height: 44%; border-radius: 80px 14px 14px 80px; }
  .right { right: 0; top: 28%; width: 28%; height: 44%; border-radius: 14px 80px 80px 14px; }
  .ok { left: 31%; top: 31%; width: 38%; height: 38%; border-radius: 50% !important; background: var(--accent) !important; font-size: 20px !important; font-weight: 700; color: #fff !important; }
  .ok:active { filter: brightness(1.15); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .row.two { grid-template-columns: repeat(2, 1fr); }
  .btn { height: 58px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); color: var(--text); font-size: 17px; display: grid; place-items: center; }
  .btn:active { background: #26262e; }
  .btn small { display: block; color: var(--dim); font-size: 12px; margin-top: 2px; }
  form { display: flex; gap: 10px; }
  input { flex: 1; min-width: 0; height: 52px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 0 14px; font-size: 17px; user-select: text; }
  input::placeholder { color: var(--dim); }
  form button { height: 52px; padding: 0 18px; border-radius: 14px; border: 0; background: var(--accent); color: #fff; font-size: 16px; font-weight: 600; }
  .hint { text-align: center; color: var(--dim); font-size: 13px; margin-top: auto; }
</style>
</head>
<body>
  <header><b>KINONYX</b><span><i class="dot" id="dot"></i><span id="state">подключено</span></span></header>

  <div class="dpad">
    <button class="up" data-k="ArrowUp" aria-label="Вверх">▲</button>
    <button class="left" data-k="ArrowLeft" aria-label="Влево">◀</button>
    <button class="right" data-k="ArrowRight" aria-label="Вправо">▶</button>
    <button class="down" data-k="ArrowDown" aria-label="Вниз">▼</button>
    <button class="ok" data-k="Enter">OK</button>
  </div>

  <div class="row">
    <button class="btn" data-k="Escape">Назад</button>
    <button class="btn" data-k="GamepadGuide">Меню</button>
    <button class="btn" data-k="p">Пауза</button>
  </div>
  <div class="row">
    <button class="btn" data-k="MediaRewind" data-rep="1">−15 с</button>
    <button class="btn" data-k="m">Звук<small>дорожки</small></button>
    <button class="btn" data-k="MediaFastForward" data-rep="1">+15 с</button>
  </div>

  <form id="f" autocomplete="off">
    <input id="t" type="text" enterkeyhint="send" placeholder="Ввод текста (поиск)…">
    <button type="submit">Ввести</button>
  </form>

  <div class="hint">Откройте поле поиска на экране, затем наберите текст здесь</div>

<script>
  const t = new URLSearchParams(location.search).get("t") || "";
  const dot = document.getElementById("dot"), st = document.getElementById("state");
  const mark = ok => { dot.classList.toggle("off", !ok); st.textContent = ok ? "подключено" : "нет связи"; };
  const send = (path, extra) => fetch(path + "?t=" + encodeURIComponent(t) + (extra || ""), { cache: "no-store" })
    .then(r => { mark(r.ok); return r.ok; }).catch(() => { mark(false); return false; });
  const press = k => { if (navigator.vibrate) navigator.vibrate(8); return send("/k", "&k=" + encodeURIComponent(k)); };
  document.querySelectorAll("[data-k]").forEach(b => {
    let timer = 0, rep = 0;
    const start = e => {
      e.preventDefault();
      press(b.dataset.k);
      // Arrows and seeks repeat while held.
      if (b.dataset.k.startsWith("Arrow") || b.dataset.rep) {
        timer = setTimeout(() => { rep = setInterval(() => press(b.dataset.k), 130); }, 420);
      }
    };
    const stop = () => { clearTimeout(timer); clearInterval(rep); };
    b.addEventListener("touchstart", start, { passive: false });
    b.addEventListener("touchend", stop); b.addEventListener("touchcancel", stop);
    b.addEventListener("mousedown", start); b.addEventListener("mouseup", stop); b.addEventListener("mouseleave", stop);
  });
  document.getElementById("f").addEventListener("submit", e => {
    e.preventDefault();
    const i = document.getElementById("t");
    send("/txt", "&v=" + encodeURIComponent(i.value)).then(ok => { if (ok) i.value = ""; });
  });
  setInterval(() => send("/ping"), 5000);
</script>
</body>
</html>
