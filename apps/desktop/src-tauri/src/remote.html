<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0708">
<title>KINONYX — пульт</title>
<style>
  /* Colours: the app's own (the theme chosen in Settings) are put in front of these by the server and refreshed by the page. */
  :root {
    --bg: #0a0708; --bg-2: #120c0e;
    --surface: rgba(255,255,255,.055); --surface-hi: rgba(255,255,255,.11);
    --line: rgba(255,255,255,.09); --line-hi: rgba(255,255,255,.18);
    --text: #f3ece7; --text-dim: rgba(243,236,231,.58);
    --accent: #e63950; --accent-deep: #a11f31; --on-accent: #fff;
    --radius: 8px; --logo-filter: none;
    --font: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; }
  html, body { margin: 0; height: 100%; overscroll-behavior: none; }
  body {
    background: radial-gradient(120% 70% at 50% 0%, var(--bg-2), var(--bg) 70%) var(--bg);
    color: var(--text); font: 17px/1.25 var(--font); touch-action: manipulation;
    display: flex; flex-direction: column; gap: 14px; overflow: hidden;
    padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
  }
  svg { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  svg .fill { fill: currentColor; stroke: none; }

  header { position: relative; display: flex; align-items: center; justify-content: center; min-height: 40px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .22em; font-size: 16px; }
  .brand img { width: 28px; height: 28px; object-fit: contain; filter: var(--logo-filter); }
  /* Connection: only a dot — green while the app answers, red when it does not. */
  .dot { position: absolute; right: 2px; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 0 3px rgba(61,220,132,.18); transition: background .2s, box-shadow .2s; }
  .dot.off { background: #ff3b4a; box-shadow: 0 0 0 3px rgba(255,59,74,.2); }

  main { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; }

  /* Press feedback shared by every key: a solid surface that fills with the accent while held. */
  .key {
    position: relative; display: grid; place-items: center; border: 1px solid var(--line); background: var(--surface);
    color: var(--text); border-radius: var(--radius); font: inherit; padding: 0; cursor: pointer;
    transition: transform .08s, background .12s, border-color .12s;
  }
  .key.down { transform: scale(.955); background: var(--surface-hi); border-color: var(--line-hi); }

  .media { display: grid; grid-template-columns: 1fr 1.35fr 1fr; gap: 10px; }
  .media .key { height: 64px; font-size: 28px; }
  .media .main { background: var(--accent); color: var(--on-accent); border-color: transparent; font-size: 32px; }
  .media .main.down { background: var(--accent-deep); }
  .key small { position: absolute; bottom: 5px; font-size: 11px; color: var(--text-dim); letter-spacing: .02em; }

  .pad-wrap { flex: 1; min-height: 0; display: grid; place-items: center; }
  .pad {
    position: relative; width: min(100%, 52vh, 360px); aspect-ratio: 1;
    border-radius: 50%; background: var(--surface); border: 1px solid var(--line); overflow: hidden;
  }
  .pad .arrow {
    position: absolute; display: grid; place-items: center; border: 0; background: none; color: var(--text); font-size: 34px; padding: 0;
    transition: background .1s;
  }
  .pad .arrow.down { background: var(--surface-hi); }
  .pad .u { top: 0; left: 24%; width: 52%; height: 31%; }
  .pad .d { bottom: 0; left: 24%; width: 52%; height: 31%; }
  .pad .l { left: 0; top: 24%; width: 31%; height: 52%; }
  .pad .r { right: 0; top: 24%; width: 31%; height: 52%; }
  .pad::before, .pad::after { content: ""; position: absolute; background: var(--line); pointer-events: none; }
  .pad::before { left: 14%; right: 14%; top: 50%; height: 1px; transform: rotate(45deg); }
  .pad::after { left: 14%; right: 14%; top: 50%; height: 1px; transform: rotate(-45deg); }
  .pad .ok {
    position: absolute; left: 32%; top: 32%; width: 36%; height: 36%; border-radius: 50%; border: 0;
    background: var(--accent); color: var(--on-accent); font: 700 22px var(--font); letter-spacing: .04em; z-index: 1;
    transition: transform .08s, background .12s;
  }
  .pad .ok.down { transform: scale(.94); background: var(--accent-deep); }

  .bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .bar .key { height: 62px; font-size: 24px; }

  /* The text field slides up when the keyboard key is pressed; what is typed goes to the TV as it is typed. */
  .typing { display: none; gap: 10px; }
  .typing.on { display: flex; }
  .typing input {
    flex: 1; min-width: 0; height: 52px; border-radius: var(--radius); border: 1px solid var(--line-hi); background: var(--surface);
    color: var(--text); padding: 0 14px; font: inherit; user-select: text; -webkit-user-select: text; outline: none;
  }
  .typing input:focus { border-color: var(--accent); }
  .typing .key { width: 52px; height: 52px; font-size: 22px; }
  .typing .go { background: var(--accent); color: var(--on-accent); border-color: transparent; }

  /* Wide screen (phone on its side): the pad on the left, everything else on the right. */
  @media (orientation: landscape) and (max-height: 560px) {
    body { flex-direction: row; flex-wrap: wrap; align-content: flex-start; gap: 10px 22px; }
    header { width: 100%; min-height: 24px; }
    main { flex: 1; flex-direction: row; align-items: stretch; gap: 22px; }
    .pad-wrap { flex: 1; }
    .pad { width: min(100%, 62vh); }
    .side { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px; min-width: 0; }
    .media .key, .bar .key { height: 56px; }
  }
  .side { display: contents; }
  @media (orientation: landscape) and (max-height: 560px) { .side { display: flex; } }
</style>
<style id="app-theme">/*THEME*/</style>
</head>
<body>
  <header>
    <span class="brand"><img id="logo" alt="">KINONYX</span>
    <i class="dot" id="dot" aria-label="связь"></i>
  </header>

  <main>
    <div class="side" id="side">
      <div class="media">
        <button class="key" data-k="MediaRewind" data-rep="1" aria-label="Назад на 15 секунд">
          <svg viewBox="0 0 24 24"><polygon points="11 19 2 12 11 5 11 19"/><polygon points="22 19 13 12 22 5 22 19"/></svg><small>−15 с</small>
        </button>
        <button class="key main" data-k="p" aria-label="Пауза / продолжить">
          <svg viewBox="0 0 24 24"><polygon class="fill" points="6 4 20 12 6 20 6 4"/></svg>
        </button>
        <button class="key" data-k="MediaFastForward" data-rep="1" aria-label="Вперёд на 15 секунд">
          <svg viewBox="0 0 24 24"><polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/></svg><small>+15 с</small>
        </button>
      </div>
    </div>

    <div class="pad-wrap">
      <div class="pad">
        <button class="arrow u" data-k="ArrowUp" aria-label="Вверх"><svg viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg></button>
        <button class="arrow l" data-k="ArrowLeft" aria-label="Влево"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
        <button class="arrow r" data-k="ArrowRight" aria-label="Вправо"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
        <button class="arrow d" data-k="ArrowDown" aria-label="Вниз"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
        <button class="ok" data-k="Enter" aria-label="OK">OK</button>
      </div>
    </div>

    <div class="side" id="side2">
      <form class="typing" id="typing" autocomplete="off">
        <input id="t" type="text" enterkeyhint="search" placeholder="Текст для поиска…" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button type="button" class="key" id="clear" aria-label="Очистить"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        <button type="submit" class="key go" aria-label="Найти"><svg viewBox="0 0 24 24"><path d="M20 4v7a4 4 0 0 1-4 4H4"/><path d="m9 10-5 5 5 5"/></svg></button>
      </form>
      <div class="bar">
        <button class="key" data-k="Escape" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
        <button class="key" data-k="GamepadGuide" aria-label="Меню"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <button class="key" data-k="m" aria-label="Звук и субтитры"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15h4M15 15h2M7 11h2M13 11h4"/></svg></button>
        <button class="key" id="kb" type="button" aria-label="Ввод текста"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h.01M12 12h.01M16 12h.01M7 16h10"/></svg></button>
      </div>
    </div>
  </main>

<script>
  const t = new URLSearchParams(location.search).get("t") || "";
  const dot = document.getElementById("dot");
  const mark = ok => dot.classList.toggle("off", !ok);
  document.getElementById("logo").src = "/logo.png?t=" + encodeURIComponent(t);
  const send = (path, extra) => fetch(path + "?t=" + encodeURIComponent(t) + (extra || ""), { cache: "no-store" })
    .then(r => { mark(r.ok); return r.ok; }).catch(() => { mark(false); return false; });
  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
  const press = k => { buzz(10); return send("/k", "&k=" + encodeURIComponent(k)); };

  // Every key reacts at once on touch; arrows and seeks repeat while held.
  document.querySelectorAll("[data-k]").forEach(b => {
    let delay = 0, rep = 0;
    const start = e => {
      e.preventDefault();
      b.classList.add("down");
      press(b.dataset.k);
      if (b.dataset.k.startsWith("Arrow") || b.dataset.rep) {
        delay = setTimeout(() => { rep = setInterval(() => press(b.dataset.k), 120); }, 380);
      }
    };
    const stop = () => { b.classList.remove("down"); clearTimeout(delay); clearInterval(rep); };
    b.addEventListener("touchstart", start, { passive: false });
    b.addEventListener("touchend", stop); b.addEventListener("touchcancel", stop);
    b.addEventListener("mousedown", start); b.addEventListener("mouseup", stop); b.addEventListener("mouseleave", stop);
  });

  // Text: shown on the TV as it is typed; the check key presses OK there.
  const typing = document.getElementById("typing"), input = document.getElementById("t");
  let pending = 0;
  const push = () => { clearTimeout(pending); pending = setTimeout(() => send("/txt", "&v=" + encodeURIComponent(input.value)), 120); };
  document.getElementById("kb").addEventListener("click", () => {
    const on = !typing.classList.contains("on");
    typing.classList.toggle("on", on);
    buzz(10);
    if (on) input.focus(); else input.blur();
  });
  input.addEventListener("input", push);
  document.getElementById("clear").addEventListener("click", () => { input.value = ""; push(); input.focus(); });
  typing.addEventListener("submit", e => { e.preventDefault(); clearTimeout(pending); send("/txt", "&v=" + encodeURIComponent(input.value)).then(() => press("Enter")); input.blur(); });

  // The app's theme: read again every few seconds (it doubles as the connection check), so changing the
  // theme in the app changes the remote too.
  let lastTheme = "";
  const loadTheme = () => fetch("/theme?t=" + encodeURIComponent(t), { cache: "no-store" })
    .then(r => r.ok ? r.text() : Promise.reject()).then(text => {
      mark(true);
      if (text === lastTheme) return;
      lastTheme = text;
      const vars = JSON.parse(text), root = document.documentElement.style;
      for (const k in vars) if (/^--[a-z0-9-]+$/.test(k)) root.setProperty(k, vars[k]);
      const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
      if (bg) document.querySelector('meta[name="theme-color"]').content = bg;
    }).catch(() => mark(false));
  loadTheme();

  // The phone stays awake while the remote is open.
  const keepAwake = async () => { try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch (e) {} };
  keepAwake();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { keepAwake(); loadTheme(); } });
  setInterval(loadTheme, 3000);
  document.addEventListener("contextmenu", e => e.preventDefault());
</script>
</body>
</html>
