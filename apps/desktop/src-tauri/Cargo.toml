[package]
name = "kinonyx"
version = "1.0.7"
description = "KINONYX — фильмы и сериалы через торренты, с метаданными Kinopoisk"
authors = ["KINONYX"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kinonyx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-libmpv = "0.3.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "gzip", "brotli", "json", "multipart"] }
dotenvy = "0.15"
urlencoding = "2"
tokio = { version = "1", features = ["time", "net", "io-util", "sync", "rt", "macros", "fs", "process"] }
base64 = "0.22"
libloading = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2"
quick-xml = "0.42"
chrono = "0.4"
tauri-plugin-updater = "2.13.1"

[target.'cfg(windows)'.dependencies]
win32job = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
